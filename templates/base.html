<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Prototype local et fictif de gestion de sinistres automobiles au Maroc.">
  <title>{% block title %}Med Assurance{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <button class="nav-toggle" type="button" id="navToggle" aria-label="Ouvrir la navigation" aria-expanded="false" aria-controls="sidenav">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="nav-scrim" id="navScrim" hidden></div>

  <div class="app">
    <nav class="sidenav" id="sidenav" aria-label="Navigation principale">
      <a class="sidenav__brand" href="/"><img src="/static/logo.png" alt="Med Assurance"></a>

      <a class="sidenav__link {{ 'is-active' if active == 'overview' }}" href="/overview">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Vue d'ensemble</span>
      </a>
      <a class="sidenav__link {{ 'is-active' if active == 'claim' }}" href="/claim">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/></svg>
        <span>Déclarer un accident</span>
      </a>
      <a class="sidenav__link {{ 'is-active' if active == 'crm' }}" href="/crm">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span>CRM broker</span>
      </a>
      <a class="sidenav__link {{ 'is-active' if active == 'agent' }}" href="/agent">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>
        <span>Agent IA</span>
      </a>
      <a class="sidenav__link {{ 'is-active' if active == 'directory' }}" href="/directory">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>Répertoire Maroc</span>
      </a>

    </nav>

    <main class="main" id="main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Panneau de navigation coulissant sous 1000px.
    (function () {
      const toggle = document.getElementById('navToggle');
      const scrim = document.getElementById('navScrim');
      const nav = document.getElementById('sidenav');
      if (!toggle || !scrim || !nav) return;

      function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Fermer la navigation' : 'Ouvrir la navigation');
        scrim.hidden = !open;
        if (open) nav.querySelector('a')?.focus();
      }

      toggle.addEventListener('click', () => setOpen(!document.body.classList.contains('nav-open')));
      scrim.addEventListener('click', () => setOpen(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
          setOpen(false);
          toggle.focus();
        }
      });
      // Repasse en nav fixe si l'écran s'élargit pendant que le panneau est ouvert.
      matchMedia('(min-width: 1001px)').addEventListener('change', (e) => { if (e.matches) setOpen(false); });
    })();
  </script>
</body>
</html>
